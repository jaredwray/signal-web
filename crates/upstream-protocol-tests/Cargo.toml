[package]
name = "upstream-protocol-tests"
version = "0.0.1"
description = "Runs libsignal's own rust/protocol/tests inside a browser via wasm-bindgen-test"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The tests/ directory is generated by scripts/prepare-upstream-tests.sh from
# the pinned libsignal commit; see that script for the exact transforms.

[dev-dependencies]
libsignal-protocol = { workspace = true }
libsignal-protocol-test-support = { git = "https://github.com/signalapp/libsignal", rev = "e8cc2dddd578859b4a029c9c94670b24ce2b616a" }

# Same versions as libsignal's workspace.
assert_matches = "1.5"
curve25519-dalek = { version = "5.0", features = ["digest"] }
futures-util = "0.3"
log = "0.4.21"
# Without default features env_logger prints no timestamps, so it never calls
# SystemTime::now() (which panics on wasm32-unknown-unknown).
env_logger = { version = "0.11.7", default-features = false }
proptest = { version = "1.7", default-features = false, features = ["std"] }
proptest-arbitrary-interop = "0.1.0"
rand = "0.9.4"
rand_chacha = "0.9"
rand_core = "0.9"
uuid = { version = "1.5", features = ["v4", "js"] }

getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen-test = "0.3.79"
