[net]
# Fetch the pinned libsignal / SPQR git dependencies with the git CLI so the
# environment's normal git configuration (proxy, CA bundle) applies.
git-fetch-with-cli = true

[target.wasm32-unknown-unknown]
# getrandom 0.3 needs an explicit opt-in to use the browser's
# crypto.getRandomValues() on wasm32-unknown-unknown.
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

# Dependency cooldown: Cargo won't select a crates.io version published less than
# 7 days ago, unless it is already in Cargo.lock. Requires Cargo >= 1.100.
# Urgent fix: CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate> --precise <version>
# https://doc.rust-lang.org/cargo/reference/config.html#registryglobal-min-publish-age
[registry]
global-min-publish-age = "7 days"
