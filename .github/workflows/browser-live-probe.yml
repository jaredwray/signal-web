# LIVE network probe (opt-in): loads web/probe.html in real browsers on an
# ordinary network and lets it contact Signal's public hosts directly.
# No Signal account and no credentials are used; one attempt per target.
# Runs only when the probe itself changes, or on manual dispatch.
name: browser-live-probe

on:
  workflow_dispatch:
  pull_request:
    # Everything the probe and the app page it exercises depend on.
    paths:
      - web/probe.html
      - web/probe.js
      - web/index.html
      - web/app.js
      - web/lib/**
      - tools/run-probe.mjs
      - tools/browsers.mjs
      - tools/run-local-tests.mjs
      - tools/static-server.mjs
      - tools/print-evidence.mjs
      - crates/signal-web-core/**
      - scripts/build-wasm.sh
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .github/workflows/browser-live-probe.yml

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  SIGNAL_WEB_LIVE: "1"

jobs:
  linux:
    name: Linux (Chromium, Chrome, Edge, Firefox, WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out (plain git, no third-party action)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$HEAD_SHA"
          git checkout -q FETCH_HEAD
      - name: Fresh evidence directory (only this run's results get printed)
        run: echo "EVIDENCE_OUT=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build WASM (the app page's linking attempt needs it)
        run: bash scripts/build-wasm.sh
      - name: Install npm dependencies and Playwright engines
        run: |
          npm ci
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0 npx playwright install --with-deps chromium firefox webkit
      - name: Start geckodriver (installed Firefox)
        run: |
          "$GECKOWEBDRIVER/geckodriver" --port 4444 > /tmp/geckodriver.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4444/status > /dev/null && break; sleep 1; done
      - name: Probe Signal hosts from browsers
        env:
          PROBE_TAG: github-ubuntu
        run: >
          node tools/run-probe.mjs
          --browser pw:chromium --browser pw-channel:chrome --browser pw-channel:msedge
          --browser pw:firefox --browser pw:webkit
          --browser wd:firefox@http://127.0.0.1:4444
      - name: Print evidence
        if: ${{ !cancelled() }}
        run: node tools/print-evidence.mjs "$EVIDENCE_OUT"

  safari:
    name: macOS (Safari via safaridriver)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out (plain git, no third-party action)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$HEAD_SHA"
          git checkout -q FETCH_HEAD
      - name: Fresh evidence directory (only this run's results get printed)
        run: echo "EVIDENCE_OUT=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          brew install protobuf
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build WASM (the app page's linking attempt needs it)
        run: bash scripts/build-wasm.sh
      - name: Install npm dependencies
        run: npm ci
      - name: Start safaridriver
        run: |
          sudo safaridriver --enable
          safaridriver -p 4445 > /tmp/safaridriver.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4445/status > /dev/null && break; sleep 1; done
          sw_vers
          defaults read /Applications/Safari.app/Contents/Info.plist CFBundleShortVersionString
      - name: Probe Signal hosts from Safari
        env:
          PROBE_TAG: github-macos
        run: node tools/run-probe.mjs --browser wd:safari@http://127.0.0.1:4445
      - name: Print evidence
        if: ${{ !cancelled() }}
        run: node tools/print-evidence.mjs "$EVIDENCE_OUT"
