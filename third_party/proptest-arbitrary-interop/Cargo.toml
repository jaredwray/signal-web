[package]
name = "proptest-arbitrary-interop"
description = "Interop glue between arbitrary and proptest crates"
authors = ["Graydon Hoare <graydon@pobox.com>"]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["property", "propcheck", "arbitrary", "fuzz", "testing"]
readme = "README.md"

[dependencies]
# signal-web change (the only one): disable proptest's default `fork` feature,
# whose process-spawning dependency cannot compile for wasm32-unknown-unknown.
proptest = { version = "1.0.0", default-features = false, features = ["std"] }
arbitrary = "1.1.3"

[workspace]
